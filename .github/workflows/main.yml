name: LiChess Metrics
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: ["dc"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Chess metrics
        uses: lowlighter/metrics@latest
        with:
          token: NO_NEEDED
          user: mrq8
          plugin_chess: yes
          plugin_chess_token: ${{ secrets.CHESS_TOKEN }}
          plugin_chess_user: lowlighter
          plugin_chess_platform: lichess.org
