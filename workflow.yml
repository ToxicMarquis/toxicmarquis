name: Metrics
on:
  schedule: 
    - cron: "0 */6 * * *"  # Обновление каждые 6 часов
  workflow_dispatch:
  push: 
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: your-github-username
          
          # Основные настройки
          filename: mark.plugin.chess.svg
          base: ""
          
          # Chess плагин
          plugin_chess: yes
          plugin_chess_token: ${{ secrets.CHESS_TOKEN }}
          plugin_chess_platform: lichess.org
          plugin_chess_user: your-lichess-username
          
          # Настройки анимации (опционально)
          plugin_chess_animation: |
            {
              "size": 50,
              "delay": 2,
              "duration": 0.8
            }
